name: my_flutter_web_app
description: A Flutter web application for Amity University Bengaluru.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_auth_web: ^5.8.13
  cloud_firestore: ^5.6.5
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.7
  intl: ^0.18.1
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  
  # To add assets, uncomment the following lines
  # assets:
  #   - assets/images/
  #   - assets/icons/ 